spring:
  application:
    name: api-asistente
  config:
    import: "optional:file:../.env[.properties],optional:file:./.env[.properties]"

server:
  port: 8085
  address: ${BIND_ADDRESS:127.0.0.1}
  error:
    include-stacktrace: never
    include-message: never

licitawatch:
  jwt:
    secret: ${JWT_SECRET}
  internal-api-key: ${INTERNAL_API_KEY}
  services:
    usuarios-url: ${USUARIOS_URL:http://localhost:8081}
    licitaciones-url: ${LICITACIONES_URL:http://localhost:8082}
    ventas-url: ${VENTAS_URL:http://localhost:8083}
  groq:
    api-key: ${GROQ_API_KEY:}
    model: ${GROQ_MODEL:openai/gpt-oss-120b}
    base-url: ${GROQ_API_BASE_URL:https://api.groq.com/openai/v1}
    timeout-seconds: ${GROQ_TIMEOUT_SECONDS:60}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
