spring:
  application:
    name: api-ventas
  config:
    import: "optional:file:../.env[.properties],optional:file:./.env[.properties]"
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${DB_VENTAS_NAME:licitawatch_ventas}?stringtype=unspecified
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: America/Santiago
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8083
  address: ${BIND_ADDRESS:127.0.0.1}
  error:
    include-stacktrace: never
    include-message: never

licitawatch:
  jwt:
    secret: ${JWT_SECRET}
  internal-api-key: ${INTERNAL_API_KEY}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  services:
    usuarios-url: ${USUARIOS_URL:http://localhost:8081}
    notificaciones-url: ${NOTIFICACIONES_URL:http://localhost:8084}
  webpay:
    commerce-code: ${WEBPAY_COMMERCE_CODE}
    api-key: ${WEBPAY_API_KEY}
    environment: ${WEBPAY_ENVIRONMENT:SANDBOX}
    return-url: ${WEBPAY_RETURN_URL:http://localhost:8080/api/pagos/webpay/retorno}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
